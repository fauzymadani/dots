$font = JetBrainsMono Nerd Font Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = eDP-1
    path = /home/yzuaf/Pictures/custom-wallpaper/anime/the-shorekeeper-wuthering-waves-2k-wallpaper-uhdpaper.com-313@2@b.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 0.85
    contrast = 1.05
    vibrancy = 0
}

input-field {
    monitor =
    size = 22%, 5%

    outline_thickness = 2
    inner_color = rgba({background.rgb}, 0.4)

    outer_color = rgba({color4.rgb}, 0.8) rgba({color2.rgb}, 0.8) 90deg
    check_color = rgba({color3.rgb}, 1.0) rgba({color5.rgb}, 1.0) 45deg
    fail_color = rgba({color1.rgb}, 1.0) rgba({color9.rgb}, 1.0) 25deg

    fade_on_empty = true
    rounding = 15

    font_family = $font
	font_color = rgba({foreground.rgb}, 1.0)
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = {foreground}

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = {color4}

    position = -30, -150
    halign = right
    valign = top
}

